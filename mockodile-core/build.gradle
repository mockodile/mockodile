plugins {
    id 'java-test-fixtures'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-parameters'
}

dependencies {
    compileOnly 'com.fasterxml.jackson.core:jackson-databind:2.17.1'
    compileOnly 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.1'

    testFixturesApi("org.junit.jupiter:junit-jupiter:5.9.1")
    testFixturesApi("org.assertj:assertj-core:3.25.3")

    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}
