import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
    id 'org.springframework.boot' version '3.3.4' apply false
    id 'io.spring.dependency-management' version '1.1.6'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-parameters'
}

ext {
    set('springCloudVersion', "2023.0.2")
}

dependencies {
    implementation project(":mockodile-core")
    implementation project(":mockodile-wiremock")
    implementation 'com.github.tomakehurst:wiremock-jre8-standalone:2.35.1'
    implementation 'org.springframework:spring-context-support'
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'org.springframework:spring-web'
    implementation 'com.github.tomakehurst:wiremock-jre8-standalone'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.1'
    testImplementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation "org.springframework.cloud:spring-cloud-contract-wiremock"
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation "org.assertj:assertj-core"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        mavenBom SpringBootPlugin.BOM_COORDINATES
    }
}
